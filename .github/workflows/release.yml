name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.1.0），将自动创建此标签并发布"
        required: true

permissions:
  contents: write

jobs:
  # 手动触发时：创建标签并推送，随后的 tag push 会自动完成构建与发布
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 创建并推送标签
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v*) ;;
            *) VERSION="v$VERSION" ;;
          esac
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "标签 $VERSION 已存在"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, suffix: darwin-arm64, ext: "" }
          - { goos: darwin, goarch: amd64, suffix: darwin-amd64, ext: "" }
          - { goos: linux, goarch: arm64, suffix: linux-arm64, ext: "" }
          - { goos: linux, goarch: amd64, suffix: linux-amd64, ext: "" }
          - { goos: windows, goarch: amd64, suffix: windows-amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 编译 ${{ matrix.suffix }}
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags='-s -w' \
            -o "dist/securebox-${{ matrix.suffix }}${{ matrix.ext }}" .
          zip -j "dist/securebox-${{ matrix.suffix }}.zip" \
            "dist/securebox-${{ matrix.suffix }}${{ matrix.ext }}" README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成 SHA-256 校验和
        run: |
          cd dist
          sha256sum *.zip > sha256sums.txt
          cat sha256sums.txt
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
