name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.1.0），将自动创建此标签并发布"
        required: true

permissions:
  contents: write

jobs:
  # 确定版本号；手动触发时通过 API 创建标签（GITHUB_TOKEN 创建的标签不会触发 push 工作流，
  # 因此构建与发布在本运行内直接完成）
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 确定版本号
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          if [ "$EVENT" = "workflow_dispatch" ]; then
            V="$INPUT_VERSION"
            case "$V" in v*) ;; *) V="v$V" ;; esac
            if gh api "repos/$REPO/git/ref/tags/$V" >/dev/null 2>&1; then
              echo "标签 $V 已存在，请选择其他版本号"
              exit 1
            fi
            gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$V" -f "sha=$SHA"
            echo "已创建标签 $V"
            echo "version=$V" >> "$GITHUB_OUTPUT"
          else
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, suffix: darwin-arm64, ext: "" }
          - { goos: darwin, goarch: amd64, suffix: darwin-amd64, ext: "" }
          - { goos: linux, goarch: arm64, suffix: linux-arm64, ext: "" }
          - { goos: linux, goarch: amd64, suffix: linux-amd64, ext: "" }
          - { goos: windows, goarch: amd64, suffix: windows-amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 编译 ${{ matrix.suffix }}
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags='-s -w' \
            -o "dist/securebox-${{ matrix.suffix }}${{ matrix.ext }}" .
          zip -j "dist/securebox-${{ matrix.suffix }}.zip" \
            "dist/securebox-${{ matrix.suffix }}${{ matrix.ext }}" README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成 SHA-256 校验和
        run: |
          cd dist
          sha256sum *.zip > sha256sums.txt
          cat sha256sums.txt
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: dist/*
          generate_release_notes: true
